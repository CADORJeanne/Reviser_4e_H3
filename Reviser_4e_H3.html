<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Révisions 4e : la Révolution française et l'Empire (H3). Dates repères et définitions : flip cards, QCM, frise et interrogation blanche.">
<meta name="theme-color" content="#1E3A8A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Révise H3">
<meta name="format-detection" content="telephone=no">
<title>Réviser H3 Révolution et Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Même univers que les applis G1/G2 : boîte à fiches bristol. Couleurs des thèmes : bleu, rouge, or. */
:root{
  --paper:#E8EBEE; --card:#FFFFFF; --ink:#18202C; --ink-2:#4F5B6B; --line:#CBD3DC;
  --rule:#C9DAEE; --margin:#E6A3A3; --accent:#1E3A8A; --accent-ink:#FFFFFF; --gold:#A86A0C;
  --ok:#15803D; --mid:#B45309; --ko:#B91C1C; --shadow:rgba(24,32,44,.12);
  --c-pol:#1D4ED8; --c-soc:#B42318; --c-eur:#A15C07; --k-dat:#7C3AED; --k-def:#0F766E;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151C; --card:#19212B; --ink:#E7EBF0; --ink-2:#9DA9B8; --line:#2C3746;
  --rule:#22334A; --margin:#5C2E2E; --accent:#9DB7FF; --accent-ink:#0E1626; --gold:#E3B252;
  --ok:#4ADE80; --mid:#FBBF24; --ko:#F87171; --shadow:rgba(0,0,0,.45);
  --c-pol:#7EA6FF; --c-soc:#F87171; --c-eur:#F0B429; --k-dat:#B794F6; --k-def:#2DD4BF;
  color-scheme:dark}}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1,h2,h3{text-wrap:balance;margin:0}
.muted{color:var(--ink-2)}

/* ---------- Barre du haut ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.tab-h{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;padding:6px 10px 4px;border:2.5px solid var(--ink);border-radius:4px;letter-spacing:.02em;background:linear-gradient(90deg,transparent 0 0)}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.05;letter-spacing:.01em;text-transform:uppercase}
.brand-txt>span{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
.tricolor{display:flex;height:4px;width:66px;border-radius:2px;overflow:hidden;margin-top:6px}
.tricolor i{flex:1}
.navbtns{display:flex;gap:8px}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.ghost:hover{border-color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px}
.chip svg{color:var(--accent);flex:none}

/* ---------- Tableau de bord ---------- */
.dash{background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 10px 30px -18px var(--shadow);padding:20px;display:grid;gap:18px}
.player{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.lvl{width:66px;height:66px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:900;font-size:32px;line-height:1;position:relative}
.lvl small{position:absolute;bottom:-8px;font-family:var(--f-mono);font-size:10px;background:var(--card);color:var(--ink);border:1.5px solid var(--accent);border-radius:999px;padding:1px 7px;letter-spacing:.06em}
.pinfo{flex:1;min-width:200px}
.pname h2{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;text-transform:uppercase;letter-spacing:.01em}
.xpbar{height:12px;border-radius:999px;background:var(--paper);overflow:hidden;margin-top:8px;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .6s ease}
.xptxt{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink-2);line-height:1.25;display:block;margin-top:3px}
.stat.ready b{color:var(--ok)}
.stat.fire b{color:var(--mid)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px;flex-wrap:wrap}
.sec-title h3{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.stepn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:17px;margin-right:10px;vertical-align:2px}

/* Thèmes */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:640px){.themes{grid-template-columns:1fr}}
.theme{--c:var(--accent);text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:7px;transition:border-color .15s,transform .15s}
.theme:hover{transform:translateY(-1px)}
.theme[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--card);background:color-mix(in srgb,var(--c) 7%,var(--card))}
.th-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.th-ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--c);background:var(--card);background:color-mix(in srgb,var(--c) 12%,var(--card))}
.theme[aria-pressed="true"] .th-ico{background:var(--c);color:var(--card)}
.th-part{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);font-weight:600}
.th-name{font-family:var(--f-display);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.01em;line-height:1.05}
.th-sub{font-size:13px;color:var(--ink-2);line-height:1.3}
.chk,.tchk{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.theme[aria-pressed="true"] .chk,.ty[aria-pressed="true"] .tchk{background:var(--c);border-color:var(--c)}
.theme[aria-pressed="true"] .chk::after,.ty[aria-pressed="true"] .tchk::after{content:"";width:10px;height:5px;border-left:2.5px solid var(--card);border-bottom:2.5px solid var(--card);transform:rotate(-45deg) translate(1px,-1px)}
.th-meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mbar{height:6px;border-radius:999px;background:var(--paper);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--c);border-radius:999px}

/* Types */
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:640px){.types{grid-template-columns:1fr}}
.clist{margin:4px 0 10px;padding-left:20px;font-weight:700;font-size:clamp(16px,2.6vw,19px);line-height:1.4}
.clist li{margin:3px 0}
.yrsb{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.cut{display:block}
.seg.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;border-radius:12px;gap:4px}
@media (max-width:640px){.seg.cats{grid-template-columns:1fr 1fr}}
.seg.cats button{padding:7px 8px;font-size:13px;min-height:40px;border-radius:9px;line-height:1.15}
.seg.cats button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.idea{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px;margin-top:8px}
.idea p{margin:0;font-size:15.5px;font-weight:700;line-height:1.35}
.idea .why{display:block;font-size:13px;font-weight:700;color:var(--ko);margin-top:3px}
.idea .why.okw{color:var(--ok)}
.idea.right{border-color:var(--ok)}
.idea.wrong{border-color:var(--ko)}
.seg.cats button[disabled]{cursor:default}
@media (max-width:480px){.types{grid-template-columns:1fr}}
.ty{--c:var(--accent);display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.2;color:var(--ink-2)}
.ty svg{flex:none;color:var(--c)}
.ty span{flex:1}
.ty b{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-2);background:var(--paper);border-radius:999px;padding:1px 8px}
.ty[aria-pressed="true"]{border-color:var(--c);color:var(--ink);box-shadow:inset 0 0 0 1px var(--c);background:var(--card);background:color-mix(in srgb,var(--c) 8%,var(--card))}
.ty[aria-pressed="false"]{opacity:.6;background:var(--paper)}

/* Modes */
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:700px){.modes{grid-template-columns:1fr}}
.modes.off .mode:not(.exam){opacity:.55}
.mode{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.mode h4{margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.mode p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.4}
.mode.exam{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.veille{justify-self:start;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mid);border:1.5px solid var(--mid);border-radius:999px;padding:2px 10px}
.small-warn{font-size:12.5px!important;color:var(--mid)!important}
.seg{display:flex;gap:4px;background:var(--paper);border-radius:999px;padding:3px;width:max-content;max-width:100%}
.seg button{border:0;background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.go{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .12s}
.go:hover{filter:brightness(1.08)}
.go:active{transform:scale(.98)}
.go.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.go[disabled]{opacity:.45;cursor:not-allowed}
.review-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--mid);background:var(--card);background:color-mix(in srgb,var(--mid) 8%,var(--card))}
.review-banner p{margin:0;font-size:14.5px;min-width:0}
.review-banner .go{background:var(--mid);color:var(--card)}

.how{margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.how h3{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 8px}
.how ol{margin:0;padding:0;list-style:none;counter-reset:st;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.how li{counter-increment:st;font-size:14.5px;line-height:1.4;display:grid;gap:4px;align-content:start;min-width:0}
.how li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:17px}
.how p{margin:12px 0 0;font-size:14px;color:var(--ink-2)}
@media (max-width:640px){.how ol{grid-template-columns:1fr 1fr}}

/* ---------- Session ---------- */
.sess-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.prog{flex:1;height:10px;background:var(--card);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .35s ease}
.sess-count{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.combo{font-family:var(--f-display);font-weight:900;font-size:19px;color:var(--mid);min-width:64px;text-align:right;letter-spacing:.02em}
.combo.pop{animation:pop .35s ease}
@keyframes pop{50%{transform:scale(1.35)}}

/* Carte qui se glisse */
.swipe{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:grab}
.swipe.anim{transition:transform .32s cubic-bezier(.2,.75,.25,1)}
.swipe.nudge{animation:nudge .45s ease}
@keyframes nudge{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.sstamp{position:absolute;bottom:26px;z-index:5;font-family:var(--f-display);font-weight:900;font-size:clamp(20px,4vw,28px);text-transform:uppercase;letter-spacing:.04em;padding:4px 12px;border:4px solid;border-radius:8px;opacity:0;pointer-events:none;background:var(--card)}
.sstamp.ok{left:22px;color:var(--ok);border-color:var(--ok);transform:rotate(-12deg)}
.sstamp.ko{right:22px;color:var(--ko);border-color:var(--ko);transform:rotate(12deg)}
.stage{perspective:1600px}
.flip{display:grid;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.25,1)}
.flip.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 18px 40px -22px var(--shadow);min-height:330px;display:flex;flex-direction:column;overflow:hidden;--c:var(--accent)}
.face.back{transform:rotateY(180deg)}
.ruled{flex:1;display:flex;flex-direction:column;padding:22px 22px 18px 44px;position:relative;
  background-image:linear-gradient(var(--card) 0 0),repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);
  background-size:2px 100%,100% 100%;background-repeat:no-repeat;background-position:30px 0,0 6px}
.ruled::before{content:"";position:absolute;left:32px;top:0;bottom:0;width:1.5px;background:var(--margin)}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;border-bottom:3px solid var(--c);background:var(--card);background:color-mix(in srgb,var(--c) 9%,var(--card))}
.ftag{font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.fbox{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);display:flex;gap:3px;align-items:center}
.fbox i{width:8px;height:8px;border-radius:2px;background:var(--line);display:inline-block}
.fbox i.on{background:var(--c)}
.qwrap{margin:auto 0;padding-block:14px}
.qk{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--kc);margin-bottom:8px}
.q{font-weight:700;font-size:clamp(22px,3.8vw,30px);line-height:1.28;text-wrap:balance}
.hint{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);text-align:center;letter-spacing:.04em;margin-top:auto}
.ans-label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);font-weight:600}
.ans{font-weight:700;font-size:clamp(19px,3vw,24px);line-height:1.32;margin:4px 0 10px}
.ans.big{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,7vw,50px);line-height:1;letter-spacing:.01em;margin:6px 0 12px;color:var(--c)}
.det{font-size:15.5px;line-height:1.6;margin:0 0 8px;color:var(--ink)}
.qback{font-size:13.5px;color:var(--ink-2);margin:0 0 6px;font-style:italic}

.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.sbtns button{border:2px solid;background:var(--card);border-radius:12px;padding:12px 8px;font-family:var(--f-display);font-weight:800;font-size:clamp(17px,3.6vw,21px);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.05;transition:transform .1s}
.sbtns button:active{transform:scale(.97)}
.sb-ko{color:var(--ko);border-color:var(--ko)!important}
.sb-ok{color:var(--ok);border-color:var(--ok)!important}
.sb-ko:hover{background:color-mix(in srgb,var(--ko) 8%,var(--card))}
.sb-ok:hover{background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.reveal{margin-top:12px;width:100%}
.swipehint{text-align:center;font-size:13.5px;color:var(--ink-2);margin-top:10px;display:flex;align-items:center;justify-content:center;gap:10px}
.swipehint b{font-weight:700}
.keys{text-align:center;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);margin-top:8px}
@media (hover:none){.keys{display:none}}
#actions{position:sticky;bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 70%,transparent);z-index:3}
.xpfloat{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-family:var(--f-display);font-weight:900;font-size:38px;color:var(--gold);pointer-events:none;animation:xpf .9s ease forwards;z-index:30;text-shadow:0 2px 0 var(--card)}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px)}}

/* QCM */
.qcm-opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15.5px;line-height:1.4;display:flex;gap:12px;align-items:flex-start;touch-action:manipulation}
.opt .l{font-family:var(--f-mono);font-weight:600;width:26px;height:26px;flex:none;border-radius:6px;display:grid;place-items:center;background:var(--paper);font-size:13px}
.opt:hover:not([disabled]){border-color:var(--ink-2)}
.opt.good{border-color:var(--ok);background:var(--card);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.opt.bad{border-color:var(--ko);background:var(--card);background:color-mix(in srgb,var(--ko) 10%,var(--card))}
.opt.chosen{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.opt.chosen .l{background:var(--accent);color:var(--accent-ink)}
.opt[disabled]{cursor:default}
.feedback{margin-top:12px;border-radius:12px;padding:12px 14px;background:var(--card);border-left:5px solid var(--ok);font-size:15px}
.feedback.ko{border-left-color:var(--ko)}

/* Saisie d'une année */
.yearbox{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
.yearin{font-family:var(--f-display);font-weight:900;font-size:44px;width:170px;text-align:center;letter-spacing:.06em;padding:6px 10px;border:2.5px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink);font-variant-numeric:tabular-nums}

.datebox{display:flex;gap:10px;justify-content:center;align-items:flex-end;margin-top:16px;flex-wrap:wrap}
.datebox label{display:grid;gap:4px;justify-items:center}
.datebox label span{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

@media (max-width:480px){.datebox .yearin{font-size:34px}.datebox .din{width:80px}.datebox [id=dA]{width:130px}.msel{height:58px;min-width:150px;font-size:18px}}


/* Frise : remettre dans l'ordre */
.frise-pool{display:grid;gap:10px;margin-top:14px}
.ev{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-size:15.5px;line-height:1.35;--c:var(--accent);touch-action:manipulation}
.ev .n{width:34px;height:34px;flex:none;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:19px}
.ev.picked{border-color:var(--accent)}
.ev.picked .n{border:0;background:var(--accent);color:var(--accent-ink)}
.ev .tg{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c);display:block}
.ev .yr{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:13px;white-space:nowrap;color:var(--ok)}
.ev.right{border-color:var(--ok)}
.ev.wrong{border-color:var(--ko)}
.ev.right .n{background:var(--ok);color:var(--card);border:0}
.ev.wrong .n{background:var(--ko);color:var(--card);border:0}
.ev[disabled]{cursor:default}
.timeline{position:relative;margin-top:10px;padding-left:24px;display:grid;gap:10px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:2px}
.tl{position:relative;font-size:15px;line-height:1.35}
.tl::before{content:"";position:absolute;left:-21px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--c,var(--accent));border:2px solid var(--card)}
.tl b{font-family:var(--f-mono);font-size:13px;margin-right:8px;color:var(--c)}

/* Frise des régimes */
.rbar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0 2px;border:1.5px solid var(--ink)}
.rbar i{display:block;height:100%}
.rticks{position:relative;height:16px;font-family:var(--f-mono);font-size:11px;color:var(--ink-2);margin-bottom:14px}
.rticks span{position:absolute;transform:translateX(-50%)}
.rticks span:last-child{transform:translateX(-100%)}
.rrow.cause{margin-left:22px}
.cause-l{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);line-height:1.2}
.cause-l svg{transform:rotate(90deg);flex:none}
.rrow.cause .rslot{min-height:42px;font-weight:400;font-size:14.5px;border-radius:999px}
.rdate{grid-column:2;font-family:var(--f-mono);font-size:12.5px;color:var(--ok);font-weight:600;margin-top:-4px}
.lbl.cause{border-style:dashed;font-weight:400}
.rrows{display:grid;gap:8px}
.rrow{display:grid;grid-template-columns:118px 1fr;gap:10px;align-items:center}
.rrow .yrs{font-family:var(--f-mono);font-weight:600;font-size:14px;border-left:7px solid var(--rc);padding:6px 0 6px 9px;line-height:1.2}
.rslot{min-height:48px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;padding:4px 12px;background:var(--card);text-align:left;font-weight:700;font-size:15px}
.rslot:empty::before{content:"Touchez pour placer";font-weight:400;color:var(--ink-2);font-size:13px;font-family:var(--f-mono)}
.rslot.armed{border-color:var(--accent)}
.rslot.good{border-style:solid;border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}
.rslot.bad{border-style:solid;border-color:var(--ko);background:color-mix(in srgb,var(--ko) 10%,var(--card))}
.rcorr{grid-column:2;font-size:13px;color:var(--ko);font-weight:700;margin-top:-4px}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;min-height:58px;margin-top:14px;background:var(--card);border:1.5px dashed var(--line);border-radius:12px}
.bank:empty::before{content:attr(data-empty);color:var(--ink-2);font-size:14px;padding:6px}
.lbl{display:inline-flex;align-items:center;justify-content:center;padding:8px 13px;border-radius:999px;background:var(--card);border:2px solid var(--ink);font-weight:700;font-size:14px;line-height:1.2;text-align:center;touch-action:manipulation}
.lbl.sel{background:var(--ink);color:var(--card)}
@media (max-width:480px){.rrow{grid-template-columns:92px 1fr}.rrow .yrs{font-size:12.5px}.rrow.cause{margin-left:0}}


/* Frise du cours, à l'horizontale comme la fiche */
.fscroll{overflow-x:auto;margin-top:14px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.fgrid{display:grid;grid-template-columns:repeat(9,minmax(64px,1fr));gap:10px 6px;min-width:720px;align-items:start}
.chev{background:var(--rc);color:#fff;font-family:var(--f-display);font-weight:800;font-size:clamp(16px,1.9vw,20px);line-height:1.1;letter-spacing:.02em;text-align:center;padding:8px 18px;clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%)}
.fslot{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;align-content:start}
.fslot.reg{border-top:5px solid var(--line);min-height:92px}
.fslot.cau{border-style:dashed;border-radius:14px;background:color-mix(in srgb,var(--card) 70%,transparent)}
.fslot.good{border-color:var(--ok);border-style:solid;background:color-mix(in srgb,var(--ok) 9%,var(--card))}
.fslot.bad{border-color:var(--ko);border-style:solid;background:color-mix(in srgb,var(--ko) 9%,var(--card))}
.fcap{display:flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.fslot.cau .fcap svg{transform:rotate(30deg)}
.fdrop{min-height:46px;border:2px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;padding:4px;text-align:center;transition:border-color .15s,background .15s}
.fdrop:empty::before{content:"Déposez ici";font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.fdrop.hover,.fbank.hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.fdrop .lbl{width:100%}
.fdrop b{font-size:14.5px;line-height:1.25}
.fdate{font-family:var(--f-mono);font-size:11.5px;font-weight:600;color:var(--ok);line-height:1.3}
.fcorr{font-size:12.5px;font-weight:700;color:var(--ko);line-height:1.3}
.fdrop.multi{flex-direction:column;gap:6px;align-items:stretch;min-height:52px}
.fslot.evts{border-color:#DC2626;border-style:dashed}
.fres{display:block;border-radius:8px;padding:5px 8px;font-weight:700;font-size:13.5px;line-height:1.25;text-align:center;border:1.5px solid}
.fres small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:600}
.fres.ok{border-color:var(--ok);color:var(--ink)}.fres.ok small{color:var(--ok)}
.fres.ko{border-color:var(--ko);color:var(--ko);text-decoration:line-through}
.fres.ko small{display:none}
.lbl.cause{font-size:13px;padding:6px 10px}
.asso{display:grid;gap:8px;margin-top:14px}
.sbank{position:sticky;bottom:0;z-index:4;max-height:34vh;overflow-y:auto;box-shadow:0 -10px 24px -14px var(--shadow);border-style:solid}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px}
.arow p{margin:0;font-weight:700;font-size:15.5px;line-height:1.3}
.arow .fcorr{display:block;margin-top:2px}
.arow.good{border-color:var(--ok)}.arow.bad{border-color:var(--ko)}
.adrop{min-height:48px}
.lbl.dlbl{font-family:var(--f-mono);font-weight:600;font-size:13.5px}
@media (max-width:520px){.arow{grid-template-columns:1fr}}
.fswipe{font-size:12.5px;margin:4px 0 0;display:none}
@media (max-width:760px){.fswipe{display:block}}
.fbank{position:relative}
.lbl[data-l]{cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.lbl.dragging{opacity:.3}
.dragghost{position:fixed;pointer-events:none;z-index:60;transform:translate(-50%,-50%) rotate(-3deg);box-shadow:0 10px 24px var(--shadow);max-width:240px}
/* Choix */
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}
.pickcard{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start;transition:border-color .15s,transform .15s}
.pickcard:hover{border-color:var(--ink);transform:translateY(-2px)}
.pickcard b{font-family:var(--f-display);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1;display:flex;gap:8px;align-items:center}
.pickcard span{font-size:14px;color:var(--ink-2);line-height:1.4}
.pickcard .fbox{color:var(--ok);font-weight:600}
.pickcard[disabled]{opacity:.5;cursor:not-allowed;transform:none}

/* Fin de session */
.endcard{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 1px 0 var(--line),0 18px 40px -22px var(--shadow);display:grid;gap:16px}
.endcard h2{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6vw,44px);text-transform:uppercase;line-height:1}
.endstats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:560px){.endstats{grid-template-columns:repeat(2,1fr)}}
.endstats .stat b.k{color:var(--ko)} .endstats .stat b.o{color:var(--ok)} .endstats .stat b.x{color:var(--gold)}
.miss{display:grid;gap:8px}
.miss details{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;--c:var(--accent);background:var(--card)}
.miss summary{cursor:pointer;font-weight:700;font-size:15px}
.miss summary .ftag{margin-right:8px}
.miss details p{margin:8px 0 0;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .go{flex:1;min-width:180px}
.h3s{font-family:var(--f-display);text-transform:uppercase;font-size:20px;margin-bottom:8px}
.note20{font-size:clamp(56px,12vw,84px)!important;color:var(--accent)}
.note20 small{font-size:.4em;color:var(--ink-2);margin-left:4px}

/* Badges */
.medal{width:88px;display:grid;justify-items:center;gap:6px;text-align:center}
.medal .disc{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--gold) 55%,var(--card)),var(--gold));color:var(--card);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 3px var(--card),0 0 0 5px var(--gold)}
.medal .disc svg{width:30px;height:30px}
.medal span{font-size:12px;font-weight:700;line-height:1.2}
.medal.locked .disc{background:var(--paper);color:var(--ink-2);box-shadow:inset 0 0 0 2px var(--line);opacity:.8}
.medal.locked span{color:var(--ink-2);font-weight:400}
.badge-strip{display:flex;gap:10px;flex-wrap:wrap}
.badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}

.bitem.locked b{color:var(--ink-2)}
.bilan{background:var(--card);border-radius:14px;padding:20px;border:2px solid var(--ink);display:grid;gap:12px;position:relative;overflow:hidden}
.bilan .stamp{position:absolute;right:14px;top:14px;transform:rotate(8deg);border:3px solid var(--ok);color:var(--ok);font-family:var(--f-display);font-weight:900;font-size:18px;text-transform:uppercase;padding:2px 10px;border-radius:6px;letter-spacing:.04em}
.bilan h2{font-family:var(--f-display);font-weight:900;font-size:28px;text-transform:uppercase;padding-right:120px}
.tbars{display:grid;gap:7px}
.tbar{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;font-size:14px;--c:var(--accent)}
.tbar .mbar{height:9px}
.tbar b{font-family:var(--f-mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:480px){.tbar{grid-template-columns:120px 1fr 40px;font-size:13px}}
.bh{margin:6px 0 0;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.listh{margin:14px 0 6px;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.danger{background:none;border:1.5px solid var(--ko);color:var(--ko);border-radius:8px;padding:7px 12px;font-weight:700;font-size:13.5px}
.confirm-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}

/* Toast et confettis */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(160%);background:var(--ink);color:var(--paper);border-radius:14px;padding:12px 16px 12px 12px;display:flex;align-items:center;gap:12px;z-index:40;transition:transform .45s cubic-bezier(.2,.9,.3,1.2);max-width:calc(100% - 32px);box-shadow:0 12px 30px -10px var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast .medal{width:auto}
.toast .medal .disc{width:46px;height:46px;box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--gold)}
.toast .medal .disc svg{width:22px;height:22px}
.toast small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.toast b{font-size:16px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:35}
.foot{margin-top:34px;font-size:12.5px;color:var(--ink-2);text-align:center;font-family:var(--f-mono)}
.fade-in{animation:fin .3s ease}
@keyframes fin{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
button,.opt,.ev,.theme{-webkit-tap-highlight-color:transparent}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}

}

  const ps = Array.from({length:90}, () => ({x:W/2 + (Math.random()-.5)*80, y:H*.75, vx:(Math.random()-.5)*12, vy:-Math.random()*14-6, r:Math.random()*6+3, c:cols[Math.floor(Math.random()*cols.length)], a:Math.random()*6, s:(Math.random()-.5)*.3}));

  })();
}

/* ---------- Typographie française : espace insécable avant : ; ! ? » et après « ---------- */
const NB = " ";
function typo(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())) {
    const v = n.nodeValue;
    const nv = v.replace(/ ([:;!?»])/g, NB + "$1").replace(/« /g, "«" + NB);
    if (nv !== v) n.nodeValue = nv;
  }
}
new MutationObserver(() => typo(app)).observe(app, {childList:true, subtree:true});

/* ---------- Répétition espacée ---------- */
function grade(id, ok){
  const rec = S.cards[id] || (S.cards[id] = {b:0, ok:0, ko:0});
  if (ok) {
    if (rec.f) { S.comeback++; rec.f = false; }
    // carte non sue : elle revient à J+1, puis J+3, puis J+7 tant qu'elle est sue
    if (rec.st && rec.st < 3) { const d = new Date(); d.setDate(d.getDate() + (rec.st === 1 ? 3 : 7)); rec.due = ymd(d); rec.st++; }
    else { delete rec.due; rec.st = 0; }
    rec.b = Math.min(5, Math.max(rec.b, 1) + 1); rec.ok++;
  } else {
    rec.b = 1; rec.ko++; rec.f = true; rec.due = tomorrow(); rec.st = 1;
  }
  rec.last = Date.now();
  S.reviewed++; markDay();
}
function pool(){ return CARDS.filter(c => S.sel.includes(c.t) && S.types.includes(c.ty)); }
function pick(list, n){
  const now = Date.now();
  return list.map(c => {
    const r = S.cards[c.id]; const b = r ? r.b : 0;
    let pr = b === 0 ? 1.3 : b === 1 ? 0 : b;
    if (r && r.last && now - r.last < 8 * 60 * 1000) pr += 1.5;
    return {c, pr: pr + Math.random() * 1.2};
  }).sort((a, b) => a.pr - b.pr).slice(0, n).map(x => x.c);
}

/* ---------- Questions à choix multiples (les mauvaises réponses sont prises dans le chapitre) ---------- */
function makeQ(c, forceDir){
  let prompt, good, cands, small = false, defStyle = false;
  if (c.ty === "dat") {
    const rev = forceDir != null ? forceDir : (!c.per && Math.random() < .4);
    if (rev && !c.per) {
      prompt = `Que se passe-t-il ? <b>${esc(c.w)}</b>`; good = c.e;
      cands = DATES.filter(o => !o.per && o.id !== c.id && yearOf(o) !== yearOf(c)).sort((a, b) => Math.abs(dayNum(a.key) - dayNum(c.key)) - Math.abs(dayNum(b.key) - dayNum(c.key))).slice(0, 8).map(o => o.e);
    } else {
      prompt = c.per ? `Quelles sont les dates de cette période ? <b>${esc(c.e)}</b>` : `Quelle est la date ? <b>${esc(c.e)}</b>`; good = c.w;
      cands = DATES.filter(o => !!o.per === !!c.per && o.id !== c.id && o.w !== c.w && (c.per || yearOf(o) !== yearOf(c)))
        .sort((a, b) => Math.abs(dayNum(a.key) - dayNum(c.key)) - Math.abs(dayNum(b.key) - dayNum(c.key))).slice(0, 7).map(o => o.w);
    }
  } else if (c.ty === "car") {
    const rev = forceDir != null ? forceDir : Math.random() < .5, others = REGS.filter(o => o.id !== c.id);
    if (rev) { prompt = `Quel régime a ces caractéristiques ?<br><span class="qdef">« ${esc(c.c.join(" ; "))} »</span>`; good = c.w; cands = others.map(o => o.w); defStyle = true; }
    else { prompt = `Quelles sont les caractéristiques de ce régime ? <b>${esc(c.w)}</b>`; good = c.c.join(" ; "); cands = others.map(o => o.c.join(" ; ")); small = true; }
  } else {
    const rev = forceDir != null ? forceDir : Math.random() < .5;
    const same = DEFS.filter(o => o.id !== c.id && o.t === c.t), other = DEFS.filter(o => o.id !== c.id && o.t !== c.t);
    const src = shuffle(same).slice(0, 6).concat(shuffle(other).slice(0, 2));
    if (rev) { prompt = `Quel mot correspond à cette définition ?<br><span class="qdef">« ${esc(c.a)} »</span>`; good = c.w; cands = src.map(o => o.w); defStyle = true; }
    else { prompt = `Quelle est la bonne définition ? <b>${esc(c.w)}</b>`; good = c.a; cands = src.map(o => o.a); small = true; }
  }
  const wrong = shuffle([...new Set(cands)].filter(x => x !== good)).slice(0, 3);
  return {c, prompt, good, opts: shuffle([good].concat(wrong)), small, defStyle};
}

function bindSwipe(){
  const sw = $("#sw"), stOk = $("#stOk"), stKo = $("#stKo");
  let st = null;
  const setStamp = dx => {
    const k = Math.min(1, Math.abs(dx) / 110);
    stOk.style.opacity = dx > 0 && F.flipped ? k : 0;
    stKo.style.opacity = dx < 0 && F.flipped ? k : 0;
  };
  sw.addEventListener("pointerdown", e => {
    if (F.busy || (e.pointerType === "mouse" && e.button !== 0)) return;
    st = {x: e.clientX, y: e.clientY, dx: 0, drag: false, id: e.pointerId};
    sw.classList.remove("anim");
  });
  sw.addEventListener("pointermove", e => {
    if (!st || e.pointerId !== st.id) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.drag && Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy)) { st.drag = true; try { sw.setPointerCapture(e.pointerId); } catch(_) {} }
    if (!st.drag) return;
    st.dx = F.flipped ? dx : dx * .25; // avant de retourner, la carte résiste
    sw.style.transform = `translateX(${st.dx}px) rotate(${st.dx / 20}deg)`;
    setStamp(st.dx);
  });
  const end = e => {
    if (!st || (e && e.pointerId !== st.id)) return;
    const s = st; st = null;
    if (!s.drag) { if (e && e.type === "pointerup") doFlip(); return; }
    const lim = Math.min(120, sw.offsetWidth * .28);
    if (F.flipped && Math.abs(s.dx) > lim) { fly(s.dx > 0); return; }
    sw.classList.add("anim"); sw.style.transform = ""; setStamp(0);
    if (!F.flipped && Math.abs(s.dx) > 20) { const h = sw.querySelector(".front .hint"); if (h) { h.textContent = "Retournez d'abord la carte pour vérifier !"; h.style.color = "var(--mid)"; } }
  };
  sw.addEventListener("pointerup", end);
  sw.addEventListener("pointercancel", end);
}
function fly(ok){
  if (view !== "flip" || F.busy) return;
  if (!F.flipped) { doFlip(); return; }
  F.busy = true;
  const sw = $("#sw");
  $(ok ? "#stOk" : "#stKo").style.opacity = 1;
  if (reduced()) { rateFlip(ok); return; }
  sw.classList.add("anim");
  sw.style.transform = `translateX(${ok ? 130 : -130}vw) rotate(${ok ? 24 : -24}deg)`;
  setTimeout(() => rateFlip(ok), 300);
}
function rateFlip(ok){
  const id = F.queue[F.i];
  grade(id, ok);
  if (!(id in F.res)) F.res[id] = ok;
  let gain;
  if (ok) { F.combo++; S.bestStreak = Math.max(S.bestStreak, F.combo); gain = 10 + Math.min(F.combo - 1, 5) * 2; }
  else { F.combo = 0; gain = 1; }
  addXP(gain);
  const n = F.requeue[id] || 0;
  if (!ok && n < 2) { F.queue.splice(Math.min(F.queue.length, F.i + 4), 0, id); F.requeue[id] = n + 1; }
  if (!F.queue.slice(F.i + 1).includes(id)) F.done++;
  F.i++;
  save(); checkBadges();
  renderFlip();
  if (F.combo >= 2) { const el = $("#combo"); if (el) el.classList.add("pop"); }
}

/* --- Glisser-déposer commun : étiquettes [data-l], cases [data-drop] ; DD = {sel, place(label, case), render()} --- */
let DD = null;
function ddRender(){ const fs = $("#fscroll"), x = fs ? fs.scrollLeft : 0; keepScroll(DD.render); const f2 = $("#fscroll"); if (f2) f2.scrollLeft = x; }
function ddPlace(l, t){ DD.sel = null; DD.place(l, t); ddRender(); }
function bindDrag(){
  const under = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest("[data-drop]"); };
  app.querySelectorAll("[data-drop]").forEach(z => z.addEventListener("click", e => { if (!e.target.closest("[data-l]") && DD.sel) ddPlace(DD.sel, z.dataset.drop); }));
  app.querySelectorAll("[data-l]").forEach(ch => {
    ch.addEventListener("pointerdown", e => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      const sx = e.clientX, sy = e.clientY; let gh = null, moved = false;
      const fs = $("#fscroll");
      const mv = ev => {
        if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) {
          moved = true; gh = ch.cloneNode(true); gh.classList.add("dragghost"); gh.classList.remove("sel");
          document.body.appendChild(gh); ch.classList.add("dragging");
        }
        if (!moved) return;
        gh.style.left = ev.clientX + "px"; gh.style.top = ev.clientY + "px";
        if (ev.clientY < 70) scrollBy(0, -14); else if (ev.clientY > innerHeight - 70) scrollBy(0, 14);
        if (fs) { const r = fs.getBoundingClientRect(); if (ev.clientY > r.top && ev.clientY < r.bottom) { if (ev.clientX < r.left + 40) fs.scrollLeft -= 12; else if (ev.clientX > r.right - 40) fs.scrollLeft += 12; } }
        const t = under(ev.clientX, ev.clientY);
        app.querySelectorAll("[data-drop]").forEach(z => z.classList.toggle("hover", z === t));
      };
      const up = ev => {
        removeEventListener("pointermove", mv); removeEventListener("pointerup", up); removeEventListener("pointercancel", up);
        if (!moved) { // simple toucher : étiquette de la liste = sélection ; étiquette placée = retour dans la liste (ou échange)
          const home_ = ch.closest("[data-drop]").dataset.drop;
          if (home_ === "bank") { DD.sel = DD.sel === ch.dataset.l ? null : ch.dataset.l; ddRender(); }
          else if (DD.sel) ddPlace(DD.sel, home_);
          else ddPlace(ch.dataset.l, "bank");
          return;
        }
        gh.remove(); ch.classList.remove("dragging");
        const t = ev.type === "pointerup" ? under(ev.clientX, ev.clientY) : null;
        if (t) ddPlace(ch.dataset.l, t.dataset.drop); else ddRender();
      };
      addEventListener("pointermove", mv); addEventListener("pointerup", up); addEventListener("pointercancel", up);
    });
  });
}
const lblHtml = (l, cls) => `<span class="lbl${cls || ""}${DD && DD.sel === l ? " sel" : ""}" data-l="${esc(l)}">${esc(l)}</span>`;

  : `<div class="row" style="margin-top:14px"><button class="go" id="check" ${done < n ? "disabled" : ""}>Vérifier ${ico("arrow",18)}</button></div>`}`;
  $("#quit").onclick = friseMenu;
  if (T.checked) { $("#again").onclick = startTri; $("#menu").onclick = friseMenu; $("#back").onclick = home; return; }
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { T.as[+b.dataset.i] = +b.dataset.k; keepScroll(renderTri); });
  $("#check").onclick = () => {
    T.checked = true;
    const sc = TRI.filter((_, i) => ok(i)).length, perfect = sc === n;
    // chaque régime compte comme réussi si toutes ses caractéristiques sont bien rangées
    REGS.forEach((r, k) => { const its = TRI.map((t, i) => [t, i]).filter(([t]) => t.r.length === 1 && t.r[0] === k); grade(r.id, its.every(([, i]) => ok(i))); });
    S.best = S.best || {}; S.best.tri = Math.max(S.best.tri || 0, sc);
    addXP(sc * 3 + (perfect ? 15 : 0)); if (perfect) confetti();
    track("session-caracteristiques"); report("Caractéristiques des régimes");
    save(); checkBadges(); keepScroll(renderTri);
  };
}

/* =========================================================
   INTERROGATION BLANCHE : 6 années à écrire + 6 définitions
   ========================================================= */
const EXAM_DATES = 10, EXAM_REGS = 2;
/* Dates toujours demandées à l'interrogation blanche (les autres sont tirées au hasard) */
const EXAM_MUST = ["pd9", "pp3", "pd11", "pd13", "ed11"]; // mort du roi, Terreur, coup d'État, sacre, Waterloo
/* Périodes des régimes demandées à chaque fois */
const EXAM_PER = ["pp0", "pp1", "pp2", "pp5"];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
/* Date au jour près ? « 14 juillet 1789 », « Nuit du 4 août 1789 », « 20 et 21 juin 1791 » (20 ou 21 accepté) */
function fullDate(c){
  const m = c.w.match(new RegExp("((?:\\d{1,2}(?: et )?)+) (" + MOIS.join("|") + ") (\\d{4})", "i"));
  return m ? {days: m[1].match(/\d{1,2}/g).map(Number), mo: MOIS.indexOf(m[2].toLowerCase()) + 1, y: +m[3]} : null;
}
let E = null, examTick = 0;
function startExam(){
  const th = S.sel.length ? S.sel : TH;
  const spread = (list, n) => { // on répartit entre les parties choisies
    const by = th.map(t => shuffle(list.filter(c => c.t === t))); const out = []; let k = 0, guard = 0;
    while (out.length < n && guard++ < 200) { const b = by[k % by.length]; if (b.length) out.push(b.pop()); k++; }
    return out;
  };
  // une date au jour près s'écrit en entier (jour, mois, année) ; sinon l'année ; une période : de … à …
  const asItem = c => {
    const cc = Object.assign({ty:"dat"}, c), r = c.w.match(/^(\d{4})-(\d{4})$/);
    if (r) return {c: cc, kind:"range", rg:[+r[1], +r[2]]};
    if (/^Jusqu'en (\d{4})$/.test(c.w)) return {c: cc, kind:"year", yy: +c.w.slice(-4), until: true};
    const fd = fullDate(c); return fd ? {c: cc, kind:"full", fd} : {c: cc, kind:"year", yy: c.y};
  };
  const must = EXAM_MUST.map(id => DATES.find(d => d.id === id)).filter(Boolean);
  const rest = shuffle(DATES.filter(d => !d.per && d.y && !EXAM_MUST.includes(d.id) && d.id !== "pd10")); // « Fin de la Terreur » donnerait la réponse de « La Terreur »
  const dates = shuffle(must.concat(rest.slice(0, EXAM_DATES - must.length))).map(asItem);
  const pers = EXAM_PER.map(id => DATES.find(d => d.id === id)).filter(Boolean).map(c => Object.assign(asItem(c), {per: true}));
  const red = DEFS.filter(d => d.cours), defsSrc = red.length ? red : shuffle(DEFS).slice(0, 5);
  const defs = shuffle(defsSrc).map(c => Object.assign(makeQ(Object.assign({ty:"def"}, c)), {kind:"qcm"}));
  const regs = shuffle(REGS).slice(0, EXAM_REGS).map(c => Object.assign(makeQ(Object.assign({ty:"car"}, c)), {kind:"qcm"}));
  // dans l'ordre : dates, périodes des régimes, définitions, caractéristiques
  E = {list: dates.concat(pers, defs, regs), i: 0, answers: {}, t0: Date.now(), xp0: S.xp};
  view = "exam"; renderExam();
  clearInterval(examTick);
  examTick = setInterval(() => { const el = $("#chrono"); if (el) el.textContent = mmss(Date.now() - E.t0); else clearInterval(examTick); }, 1000);
}
const mmss = ms => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
function renderExam(){
  const it = E.list[E.i], c = it.c, th = THEMES[c.t], a = E.answers[E.i];
  const last = E.i + 1 === E.list.length;
  let body;
  if (it.kind === "year") {
    body = `<div class="face fade-in" style="--c:${th.color};min-height:0">
      <div class="fhead"><span class="ftag">Interrogation · ${esc(tagOf(c))}</span><span class="fbox">écrivez l'année</span></div>
      <div class="ruled" style="padding-block:14px"><span class="qk" style="--kc:var(--k-dat)">${ico("cal",15)} ${it.until ? "Jusqu'en quelle année ?" : "En quelle année ?"}</span><div class="q qsmall">${esc(c.e)}</div></div></div>
      <div class="yearbox"><input class="yearin" id="yin" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="17··" autocomplete="off" aria-label="Année" value="${a != null ? esc(a) : ""}"></div>`;
  } else if (it.kind === "range") {
    const v = a || {};
    body = `<div class="face fade-in" style="--c:${th.color};min-height:0">
      <div class="fhead"><span class="ftag">Interrogation · ${it.per ? "Période d'un régime" : "Période"}</span><span class="fbox">deux années</span></div>
      <div class="ruled" style="padding-block:14px"><span class="qk" style="--kc:var(--k-dat)">${ico("cal",15)} ${it.per ? "Quelles sont les dates de ce régime ?" : "Quelles sont les dates de cette période ?"}</span><div class="q qsmall">${esc(c.e)}</div></div></div>
      <div class="datebox">
        <label><span>De</span><input class="yearin" id="rA" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="17··" autocomplete="off" value="${esc(v.a || "")}"></label>
        <label><span>à</span><input class="yearin" id="rB" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="18··" autocomplete="off" value="${esc(v.b || "")}"></label>
      </div>`;
  } else if (it.kind === "full") {
    const v = a || {};
    body = `<div class="face fade-in" style="--c:${th.color};min-height:0">
      <div class="fhead"><span class="ftag">Interrogation · ${esc(tagOf(c))}</span><span class="fbox">date complète</span></div>
      <div class="ruled" style="padding-block:14px"><span class="qk" style="--kc:var(--k-dat)">${ico("cal",15)} Donnez la date complète : jour, mois, année</span><div class="q qsmall">${esc(c.e)}</div></div></div>
      <div class="datebox">
        <label><span>Jour</span><input class="yearin din" id="dJ" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="··" autocomplete="off" value="${esc(v.d || "")}"></label>
        <label><span>Mois</span><select class="msel" id="dM"><option value="">choisir…</option>${MOIS.map((m, k) => `<option value="${k + 1}"${+v.m === k + 1 ? " selected" : ""}>${m}</option>`).join("")}</select></label>
        <label><span>Année</span><input class="yearin" id="dA" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="17··" autocomplete="off" value="${esc(v.y || "")}"></label>
      </div>`;
  } else {
    body = qHead(it, "Interrogation", "une seule bonne réponse") +
      `<div class="qcm-opts">${it.opts.map((o, i) => `<button class="opt${a === i ? " chosen" : ""}" data-i="${i}" aria-pressed="${a === i}"><span class="l">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  }
  const fullOk = v => !!v && /^\d{1,2}$/.test(v.d || "") && +v.d >= 1 && +v.d <= 31 && !!v.m && /^\d{4}$/.test(v.y || "");
  const rangeOk = v => !!v && /^\d{4}$/.test(v.a || "") && /^\d{4}$/.test(v.b || "");
  const filled = it.kind === "year" ? /^\d{4}$/.test(a || "") : it.kind === "full" ? fullOk(a) : it.kind === "range" ? rangeOk(a) : a != null;
  app.innerHTML = `
  <div class="sess-head">
    <button class="ghost" id="quit" aria-label="Abandonner">${ico("back",16)}</button>
    <div class="prog" aria-hidden="true"><i style="width:${pct(E.i / E.list.length)}%"></i></div>
    <span class="sess-count">${E.i + 1}/${E.list.length}</span>
    <span class="combo" id="chrono" title="Temps écoulé" style="font-family:var(--f-mono);font-size:15px">${mmss(Date.now() - E.t0)}</span>
  </div>
  ${body}
  <div class="row" style="margin-top:14px">
    ${E.i > 0 ? `<button class="go alt" id="prev">${ico("back",18)} Précédente</button>` : ""}
    <button class="go" id="next" ${filled ? "" : "disabled"}>${last ? "Terminer et voir ma note" : "Question suivante"} ${ico("arrow",18)}</button>
  </div>
  <div id="quitBox"></div>`;
  const next = () => { if (E.i + 1 < E.list.length) { E.i++; renderExam(); } else endExam(); };
  if (it.kind === "year") {
    const yin = $("#yin");
    yin.oninput = () => { yin.value = yin.value.replace(/\D/g, "").slice(0, 4); E.answers[E.i] = yin.value; $("#next").disabled = !/^\d{4}$/.test(yin.value); };
    yin.onkeydown = e => { if (e.key === "Enter" && /^\d{4}$/.test(yin.value)) next(); };
    if (matchMedia("(pointer: fine)").matches) yin.focus();
  } else if (it.kind === "range") {
    const v = E.answers[E.i] || (E.answers[E.i] = {}), rA = $("#rA"), rB = $("#rB");
    const upd = () => { v.a = rA.value = rA.value.replace(/\D/g, "").slice(0, 4); v.b = rB.value = rB.value.replace(/\D/g, "").slice(0, 4); $("#next").disabled = !rangeOk(v); };
    rA.oninput = () => { upd(); if (rA.value.length === 4) rB.focus(); };
    rB.oninput = upd;
    rB.onkeydown = e => { if (e.key === "Enter" && rangeOk(v)) next(); };
    if (matchMedia("(pointer: fine)").matches) rA.focus();
  } else if (it.kind === "full") {
    const v = E.answers[E.i] || (E.answers[E.i] = {}), dJ = $("#dJ"), dM = $("#dM"), dA = $("#dA");
    const upd = () => { v.d = dJ.value = dJ.value.replace(/\D/g, "").slice(0, 2); v.m = dM.value; v.y = dA.value = dA.value.replace(/\D/g, "").slice(0, 4); $("#next").disabled = !fullOk(v); };
    dJ.oninput = () => { upd(); if (dJ.value.length === 2) dM.focus(); };
    dM.onchange = () => { upd(); dA.focus(); };
    dA.oninput = upd;
    dA.onkeydown = e => { if (e.key === "Enter" && fullOk(v)) next(); };
    if (matchMedia("(pointer: fine)").matches) dJ.focus();
  } else {
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => { E.answers[E.i] = +b.dataset.i; renderExam(); });
  }
  $("#next").onclick = next;
  const pv = $("#prev"); if (pv) pv.onclick = () => { E.i--; renderExam(); };
  $("#quit").onclick = () => {
    $("#quitBox").innerHTML = `<div class="confirm-box" style="margin-top:14px"><span>Abandonner l'interrogation ? Vos réponses ne seront pas comptées.</span><button class="danger" id="qYes">Abandonner</button><button class="ghost" id="qNo">Continuer</button></div>`;
    $("#qYes").onclick = () => { clearInterval(examTick); home(); };
    $("#qNo").onclick = () => { $("#quitBox").innerHTML = ""; };
  };
  window.scrollTo(0, 0);
}
function endExam(){
  clearInterval(examTick);
  view = "end";
  const dur = Date.now() - E.t0;
  let ok = 0, okD = 0, okW = 0, okR = 0, okP = 0;
  E.list.forEach((it, i) => {
    if (it.kind === "year") { it.mine = E.answers[i] || "aucune"; it.good = +E.answers[i] === it.yy; it.pts = it.good ? 1 : 0; if (it.per) okP += it.pts; else okD += it.pts; }
    else if (it.kind === "range") {
      const v = E.answers[i] || {}; it.mine = v.a ? v.a + "-" + v.b : "aucune";
      const n = (+v.a === it.rg[0] ? 1 : 0) + (+v.b === it.rg[1] ? 1 : 0);
      it.good = n === 2; it.pts = n / 2; if (n === 1) it.halfR = true;
      if (it.per) okP += it.pts; else okD += it.pts;
    }
    else if (it.kind === "full") {
      const v = E.answers[i] || {}, f = it.fd;
      it.mine = v.d ? v.d + " " + MOIS[+v.m - 1] + " " + v.y : "aucune";
      it.good = f.days.includes(+v.d) && +v.m === f.mo && +v.y === f.y;
      it.pts = it.good ? 1 : (+v.y === f.y ? .5 : 0); okD += it.pts;
      if (it.pts === .5) it.half = true;
    }
    else { it.mine = it.opts[E.answers[i]]; it.good = it.mine === it.good; it.pts = it.good ? 1 : 0; if (it.good) { if (it.c.ty === "car") okR++; else okW++; } }
    ok += it.pts;
    grade(it.c.id, it.good);
  });
  const note = Math.round(ok / E.list.length * 40) / 2;
  addXP(ok * 8 + (note >= 16 ? 30 : 0));
  track("session-interrogation"); report("Interrogation blanche");
  S.examBest = Math.max(S.examBest || 0, note); save(); checkBadges();
  const wrong = E.list.filter(it => !it.good);
  const msg = note >= 16 ? "Excellent, vous êtes prêt !" : note >= 12 ? "Bien, encore un petit effort" : note >= 8 ? "Des bases, mais il faut réviser" : "À retravailler avant l'interrogation";
  const nP = E.list.filter(it => it.per).length, nD = E.list.filter(it => (it.kind === "year" || it.kind === "full" || it.kind === "range") && !it.per).length, nR = E.list.filter(it => it.c.ty === "car").length, nW = E.list.length - nD - nR - nP;
  app.innerHTML = `
  <div class="endcard fade-in">
    <div><span class="ftag" style="color:var(--accent)">Interrogation blanche · ${mmss(dur)}</span>
      <h2 class="note20">${String(note).replace(".", ",")}<small>/20</small></h2><p class="muted" style="margin:6px 0 0;font-size:15px">${msg} · ${String(ok).replace(".", ",")} point${ok > 1 ? "s" : ""} sur ${E.list.length}</p></div>
    <div class="tbars">
      <div class="tbar" style="--c:var(--k-dat)"><span>Dates repères</span><div class="mbar"><i style="width:${pct(okD / (nD || 1))}%"></i></div><b>${String(okD).replace(".", ",")}/${nD}</b></div>
      <div class="tbar" style="--c:var(--c-pol)"><span>Périodes des régimes</span><div class="mbar"><i style="width:${pct(okP / (nP || 1))}%"></i></div><b>${String(okP).replace(".", ",")}/${nP}</b></div>
      <div class="tbar" style="--c:var(--k-def)"><span>Définitions</span><div class="mbar"><i style="width:${pct(okW / (nW || 1))}%"></i></div><b>${okW}/${nW}</b></div>
      <div class="tbar" style="--c:var(--c-eur)"><span>Régimes</span><div class="mbar"><i style="width:${pct(okR / (nR || 1))}%"></i></div><b>${okR}/${nR}</b></div>
    </div>
    ${wrong.length ? `<div><h3 class="h3s">Corrigé de vos erreurs</h3>
      <div class="miss">${wrong.map(it => { const c = it.c, th = THEMES[c.t]; return `<details style="--c:${th.color}" open><summary><span class="ftag">${esc(tagOf(c))}</span>${esc(cardLine(c))}</summary><p class="muted">Votre réponse : ${esc(it.mine || "aucune")}${it.half ? " (année juste : ½ point)" : it.halfR ? " (une année juste : ½ point)" : ""}</p><p><b>Bonne réponse : ${esc(cardAns(c))}</b></p>${c.d ? `<div style="margin-top:4px">${c.d}</div>` : ""}</details>`; }).join("")}</div>
      <p class="muted" style="font-size:14px;margin:10px 0 0">Ces cartes reviendront demain dans « Cartes à revoir aujourd'hui ».</p></div>` : ""}
    <div class="row">
      ${wrong.length ? `<button class="go" id="again">${ico("flip",18)} Retravailler mes erreurs maintenant</button>` : ""}
      <button class="go alt" id="more">Nouvelle interrogation</button>
      <button class="go alt" id="back">Accueil</button>
    </div>
  </div>`;
  if (wrong.length) $("#again").onclick = () => startFlip(shuffle(wrong.map(it => it.c.id)));
  $("#more").onclick = startExam;
  $("#back").onclick = home;
  if (note >= 16) confetti();
  window.scrollTo(0, 0);
}
